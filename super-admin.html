<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>پلاتفۆرمی دامەزراوەکان — بەڕێوەبەری گشتی</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F4B43">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="8" y="8" width="24" height="24" rx="3" transform="rotate(45 20 20)" fill="none" stroke="var(--gold)" stroke-width="2"/>
      <circle cx="20" cy="20" r="3.5" fill="var(--gold)"/>
    </svg>
    <span data-i18n="app_title">پلاتفۆرمی دامەزراوەکان</span>
  </div>
  <div class="controls">
    <div class="lang-toggle">
      <button class="lang-pill" data-lang="ckb" onclick="setLang('ckb')">کوردی</button>
      <button class="lang-pill" data-lang="ar" onclick="setLang('ar')">العربية</button>
    </div>
    <button class="icon-btn" onclick="setTheme(getTheme()==='dark'?'light':'dark')">
      <span class="theme-toggle-icon">☾</span>
    </button>
    <button class="icon-btn" id="logoutBtn" style="display:none" title="logout">⏻</button>
  </div>
</div>

<!-- LOGIN VIEW -->
<div class="page" id="loginView">
  <div class="hero-card">
    <svg class="corner-ornament" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="var(--gold)" stroke-width="1.2">
        <rect x="20" y="20" width="45" height="45" transform="rotate(45 42.5 42.5)"/>
        <rect x="20" y="20" width="45" height="45"/>
      </g>
      <circle cx="42.5" cy="42.5" r="4" fill="var(--gold)"/>
    </svg>
    <h1 data-i18n="sa_login_heading">چوونەژوورەوەی بەڕێوەبەری گشتی</h1>
    <div class="error-box" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label data-i18n="sa_email">ئیمەیل</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label data-i18n="sa_password">وشەی نهێنی</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn" data-i18n="sa_login_btn">چوونەژوورەوە</button>
    </form>
  </div>
</div>

<!-- DASHBOARD VIEW -->
<div class="page wide" id="dashboardView" style="display:none">
  <h1 style="font-size:20px; margin-bottom:16px" data-i18n="sa_dashboard_title">داواکاریەکانی دامەزراوەکان</h1>

  <div class="tabs">
    <button class="tab active" data-status="pending" data-i18n="tab_pending">چاوەڕوان</button>
    <button class="tab" data-status="approved" data-i18n="tab_approved">پەسندکراو</button>
    <button class="tab" data-status="rejected" data-i18n="tab_rejected">ڕەتکراوە</button>
    <button class="tab" data-status="suspended" data-i18n="tab_suspended">ڕاگیراو</button>
  </div>

  <div id="cardsContainer"></div>
</div>

<!-- ACCESS DENIED VIEW -->
<div class="page" id="deniedView" style="display:none">
  <div class="hero-card">
    <p style="text-align:center; font-size:15px" data-i18n="access_denied">دەسەڵاتت نییە بۆ ئەم بەشە</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  const loginView = document.getElementById('loginView');
  const dashboardView = document.getElementById('dashboardView');
  const deniedView = document.getElementById('deniedView');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');
  const cardsContainer = document.getElementById('cardsContainer');
  let currentStatus = 'pending';

  function showView(view) {
    loginView.style.display = view === 'login' ? 'block' : 'none';
    dashboardView.style.display = view === 'dashboard' ? 'block' : 'none';
    deniedView.style.display = view === 'denied' ? 'block' : 'none';
    logoutBtn.style.display = view === 'dashboard' ? 'flex' : 'none';
  }

  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { showView('login'); return; }
    const { data: profile, error } = await sb
      .from('profiles')
      .select('role')
      .eq('id', session.user.id)
      .single();
    if (error || !profile || profile.role !== 'super_admin') {
      showView('denied');
      return;
    }
    showView('dashboard');
    loadInstitutions();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.remove('show');
    loginBtn.disabled = true;
    const fd = new FormData(loginForm);
    const { error } = await sb.auth.signInWithPassword({
      email: fd.get('email'),
      password: fd.get('password'),
    });
    loginBtn.disabled = false;
    if (error) {
      loginError.textContent = t('error_generic');
      loginError.classList.add('show');
      return;
    }
    checkSession();
  });

  logoutBtn.addEventListener('click', async () => {
    await sb.auth.signOut();
    showView('login');
  });

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((tb) => tb.classList.remove('active'));
      tab.classList.add('active');
      currentStatus = tab.dataset.status;
      loadInstitutions();
    });
  });

  function timeAgo(dateStr) {
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const days = Math.floor(diffMs / 86400000);
    if (days <= 0) return t('card_submitted');
    return `${t('card_submitted')} · ${days}`;
  }

  async function loadInstitutions() {
    cardsContainer.innerHTML = '';
    const { data, error } = await sb
      .from('institutions')
      .select('*')
      .eq('status', currentStatus)
      .order('created_at', { ascending: false });

    if (error || !data || data.length === 0) {
      cardsContainer.innerHTML = `<div class="empty-state">${t('empty_' + currentStatus)}</div>`;
      return;
    }

    data.forEach((inst) => renderCard(inst));
  }

  function renderCard(inst) {
    const div = document.createElement('div');
    div.className = 'inst-card';
    const logoHtml = inst.logo_url
      ? `<img src="${inst.logo_url}" alt="">`
      : (inst.name ? inst.name.charAt(0) : '?');

    const actionsHtml = currentStatus === 'pending' ? `
      <div class="card-actions">
        <button class="btn-reject" data-action="reject" data-i18n="btn_reject">ڕەتکردنەوە</button>
        <button class="btn-approve" data-action="approve" data-i18n="btn_approve">پەسندکردن</button>
      </div>
      <div class="reject-panel" data-panel>
        <textarea data-i18n-placeholder="reject_reason_prompt" placeholder="${t('reject_reason_prompt')}"></textarea>
        <div class="actions">
          <button class="btn-outline" data-action="cancel-reject" data-i18n="btn_cancel">پاشگەزبوونەوە</button>
          <button class="btn-reject" data-action="confirm-reject" data-i18n="btn_confirm_reject">دڵنیاکردنەوەی ڕەتکردنەوە</button>
        </div>
      </div>
    ` : '';

    div.innerHTML = `
      <div class="row">
        <div class="logo">${logoHtml}</div>
        <div style="flex:1">
          <div class="title">
            <h3>${escapeHtml(inst.name)}</h3>
            <span class="badge-status ${inst.status}" data-i18n="status_${inst.status}">${t('status_' + inst.status)}</span>
          </div>
          <div class="meta">
            ${inst.location ? escapeHtml(inst.location) + '<br>' : ''}
            ${escapeHtml(inst.email)}${inst.phone ? ' · ' + escapeHtml(inst.phone) : ''}
          </div>
          <div class="submitted">${timeAgo(inst.created_at)}</div>
        </div>
      </div>
      ${actionsHtml}
    `;

    const approveBtn = div.querySelector('[data-action="approve"]');
    const rejectBtn = div.querySelector('[data-action="reject"]');
    const panel = div.querySelector('[data-panel]');

    if (approveBtn) approveBtn.addEventListener('click', () => updateStatus(inst.id, 'approved'));
    if (rejectBtn) rejectBtn.addEventListener('click', () => panel.classList.add('show'));
    if (panel) {
      panel.querySelector('[data-action="cancel-reject"]').addEventListener('click', () => panel.classList.remove('show'));
      panel.querySelector('[data-action="confirm-reject"]').addEventListener('click', () => {
        const reason = panel.querySelector('textarea').value.trim();
        updateStatus(inst.id, 'rejected', reason);
      });
    }

    cardsContainer.appendChild(div);
  }

  async function updateStatus(id, status, reason) {
    const payload = { status };
    if (status === 'approved') payload.approved_at = new Date().toISOString();
    if (status === 'rejected') payload.rejection_reason = reason || null;
    const { error } = await sb.from('institutions').update(payload).eq('id', id);
    if (!error) {
      // TODO Phase 7: notify institution admin by email via GAS_WEBHOOK_URL
      loadInstitutions();
    }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  checkSession();
</script>
</body>
</html>
