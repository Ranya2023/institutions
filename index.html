<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>پلاتفۆرمی دامەزراوەکان</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F4B43">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="8" y="8" width="24" height="24" rx="3" transform="rotate(45 20 20)" fill="none" stroke="var(--gold)" stroke-width="2"/>
      <circle cx="20" cy="20" r="3.5" fill="var(--gold)"/>
    </svg>
    <span data-i18n="app_title">پلاتفۆرمی دامەزراوەکان</span>
  </div>
  <div class="controls">
    <div class="lang-toggle">
      <button class="lang-pill" data-lang="ckb" onclick="setLang('ckb')">کوردی</button>
      <button class="lang-pill" data-lang="ar" onclick="setLang('ar')">العربية</button>
    </div>
    <button class="icon-btn" onclick="setTheme(getTheme()==='dark'?'light':'dark')">
      <span class="theme-toggle-icon">☾</span>
    </button>
  </div>
</div>

<div class="page">

  <div class="hero-card" style="margin-top:0; text-align:center">
    <svg class="corner-ornament" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="var(--gold)" stroke-width="1.2">
        <rect x="20" y="20" width="45" height="45" transform="rotate(45 42.5 42.5)"/>
        <rect x="20" y="20" width="45" height="45"/>
      </g>
      <circle cx="42.5" cy="42.5" r="4" fill="var(--gold)"/>
    </svg>

    <h1 data-i18n="landing_heading" style="font-size:22px">بەخێربێیت</h1>
    <p class="sub" data-i18n="landing_subheading" style="margin-bottom:26px">دامەزراوەکەت تۆمار بکە یان بچۆ ژوورەوە</p>

    <a href="signup.html" class="btn-primary" style="display:block; text-decoration:none; margin-bottom:12px" data-i18n="btn_register_institution">تۆمارکردنی دامەزراوەیەکی نوێ</a>
    <a href="admin.html" class="btn-outline" style="display:block; text-decoration:none; padding:15px; text-align:center; margin-bottom:22px" data-i18n="btn_admin_login">چوونەژوورەوەی بەڕێوەبەری دامەزراوە</a>

    <p class="sub" data-i18n="landing_members_note" style="font-size:13px">مامۆستا، قوتابی یان دایک و باوکیت؟ ئەو بەستەرەی دامەزراوەکەت پێیداوە بەکاربهێنە</p>

    <div class="footer-note">
      <span data-i18n="footer_note_prefix">بەڕێوەبەری گشتی؟</span>
      <a href="super-admin.html" data-i18n="footer_note_link">چوونەژوورەوە</a>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
</body>
</html>
