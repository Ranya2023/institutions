<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>چوونەژوورەوە</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F4B43">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandBox">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="8" y="8" width="24" height="24" rx="3" transform="rotate(45 20 20)" fill="none" stroke="var(--gold)" stroke-width="2"/>
      <circle cx="20" cy="20" r="3.5" fill="var(--gold)"/>
    </svg>
    <span data-i18n="app_title">پلاتفۆرمی دامەزراوەکان</span>
  </div>
  <div class="controls">
    <div class="lang-toggle">
      <button class="lang-pill" data-lang="ckb" onclick="setLang('ckb')">کوردی</button>
      <button class="lang-pill" data-lang="ar" onclick="setLang('ar')">العربية</button>
    </div>
    <button class="icon-btn" onclick="setTheme(getTheme()==='dark'?'light':'dark')">
      <span class="theme-toggle-icon">☾</span>
    </button>
  </div>
</div>

<div class="page">

  <div class="hero-card" id="loginCard" style="display:none">
    <svg class="corner-ornament" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="var(--gold)" stroke-width="1.2">
        <rect x="20" y="20" width="45" height="45" transform="rotate(45 42.5 42.5)"/>
        <rect x="20" y="20" width="45" height="45"/>
      </g>
      <circle cx="42.5" cy="42.5" r="4" fill="var(--gold)"/>
    </svg>

    <div id="instBrandRow" style="display:flex; align-items:center; gap:12px; margin-bottom:18px"></div>

    <h1 data-i18n="login_page_heading">چوونەژوورەوە</h1>
    <p class="sub" data-i18n="login_page_subheading">کۆدەکەت بنووسە بۆ چوونەژوورەوە</p>

    <div class="error-box" id="loginError"></div>

    <form id="codeForm">
      <div class="field">
        <label data-i18n="field_code">کۆد</label>
        <input type="text" name="code" required autocomplete="off" autocapitalize="characters"
               style="font-family:monospace; font-size:18px; text-align:center; letter-spacing:.06em"
               placeholder="XXXX-XXXX">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn" data-i18n="sa_login_btn">چوونەژوورەوە</button>
    </form>
  </div>

  <div class="hero-card" id="notFoundCard" style="display:none">
    <p style="text-align:center" data-i18n="error_institution_not_found">دامەزراوە نەدۆزرایەوە</p>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui-helpers.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('inst');
  let institution = null;

  async function init() {
    if (!slug) {
      document.getElementById('notFoundCard').style.display = 'block';
      return;
    }
    const { data, error } = await sb
      .from('institutions')
      .select('name, logo_url, primary_color, secondary_color, status')
      .eq('slug', slug)
      .maybeSingle();

    if (error || !data || data.status !== 'approved') {
      document.getElementById('notFoundCard').style.display = 'block';
      return;
    }
    institution = data;
    applyInstitutionBranding(institution);

    document.getElementById('instBrandRow').innerHTML = `
      ${institution.logo_url ? `<img class="inst-logo" style="width:44px;height:44px" src="${institution.logo_url}" alt="">` : ''}
      <strong style="font-family:'Amiri',serif; font-size:16px">${institution.name}</strong>
    `;
    document.getElementById('loginCard').style.display = 'block';

    // Pre-fill from a QR/shared link like login.html?inst=slug&code=XXXX-XXXX
    const prefillCode = params.get('code');
    if (prefillCode) {
      document.querySelector('input[name="code"]').value = prefillCode.toUpperCase();
    }
  }

  document.getElementById('codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errorBox.classList.remove('show');
    btn.disabled = true;

    const fd = new FormData(e.target);
    const code = fd.get('code').trim().toUpperCase();

    try {
      const res = await fetch(window.APP_CONFIG.CODE_LOGIN_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + window.APP_CONFIG.SUPABASE_ANON_KEY,
          'apikey': window.APP_CONFIG.SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ slug, code }),
      });
      const result = await res.json();

      if (!res.ok || result.error) {
        errorBox.textContent = result.error === 'account_inactive' ? t('error_account_inactive') : t('error_invalid_code');
        errorBox.classList.add('show');
        btn.disabled = false;
        return;
      }

      // Each page (login/teacher/student/parent) stores its Supabase
      // session under its own key (see js/supabase-client.js), so that
      // logging into one portal doesn't sign you out of another tab.
      // That means we can't verify the OTP on `sb` (keyed "login") and
      // expect teacher.html/student.html/parent.html to see it — we have
      // to write the session under the *destination* page's key.
      const dest = { teacher: 'teacher.html', student: 'student.html', parent: 'parent.html' }[result.role];
      const destPageKey = (dest || 'login.html').replace('.html', '');
      const destClient = window.supabase.createClient(
        window.APP_CONFIG.SUPABASE_URL,
        window.APP_CONFIG.SUPABASE_ANON_KEY,
        { auth: { storageKey: `sb-${destPageKey}-auth-token` } }
      );

      const { error: verifyErr } = await destClient.auth.verifyOtp({
        token_hash: result.token_hash,
        type: 'magiclink',
      });
      if (verifyErr) {
        errorBox.textContent = t('error_generic');
        errorBox.classList.add('show');
        btn.disabled = false;
        return;
      }

      localStorage.setItem('inst_slug', slug);
      window.location.href = dest || 'login.html?inst=' + slug;
    } catch (err) {
      errorBox.textContent = t('error_generic');
      errorBox.classList.add('show');
      btn.disabled = false;
    }
  });

  init();
</script>
</body>
</html>
