<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>قورئانی پیرۆز</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F4B43">
<link rel="stylesheet" href="css/theme.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap');

  /* ---------- Reader toolbar ---------- */
  .reader-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .reader-audio-bar { display: flex; justify-content: center; margin-bottom: 10px; }
  .audio-play-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px;
    border-radius: 999px; border: 1.5px solid var(--gold); background: transparent;
    color: var(--teal); font-weight: 700; font-size: 14px; min-height: 44px;
  }
  html[data-theme="dark"] .audio-play-btn { color: var(--gold); }

  /* ---------- Reader card / themes ---------- */
  body[data-qtheme="classic"] { --q-bg:#FFFDF7; --q-fg:#1C231F; --q-muted:#6B6858; }
  body[data-qtheme="night"]   { --q-bg:#12181A; --q-fg:#EDE7D3; --q-muted:#9A9682; }
  body[data-qtheme="sepia"]   { --q-bg:#F1E7D0; --q-fg:#3B2A18; --q-muted:#8A7A5E; }
  body[data-qtheme="emerald"] { --q-bg:#0F2A22; --q-fg:#F3EEDD; --q-muted:#9FC2B4; }
  body[data-qtheme="sky"]     { --q-bg:#EAF3F6; --q-fg:#16323D; --q-muted:#5C7A83; }

  #readerCard { background: var(--q-bg, var(--card)); color: var(--q-fg, var(--ink)); transition: background .2s ease, color .2s ease; position: relative; }

  .quran-flow-text { font-family: 'Amiri Quran', 'Amiri', serif; text-align: justify; text-align-last: center; line-height: 2.7; font-size: var(--q-font-size, 26px); }
  .ayah-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.05em; height: 1.05em; border-radius: 50%; border: 1.5px solid currentColor;
    font-size: 0.46em; font-family: 'Amiri Quran', 'Amiri', serif; font-weight: 700; opacity: .6;
    margin: 0 3px; vertical-align: 0.1em; line-height: 1;
  }
  .ayah-unit.bookmarked .ayah-num { border-color: var(--gold); background: var(--gold); color: #fff; opacity: 1; }
  .ayah-unit.playing { background: rgba(176,141,62,.18); border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .ayah-unit.jump-target { animation: ayahFlash 1.6s ease; }
  @keyframes ayahFlash { 0%,100% { background: transparent; } 30% { background: rgba(176,141,62,.35); } }

  .surah-divider { text-align: center; margin: 26px 0 16px; padding: 12px 8px; border-top: 1px solid var(--q-muted, var(--line)); border-bottom: 1px solid var(--q-muted, var(--line)); }
  .surah-divider-name { font-family: 'Amiri Quran', 'Amiri', serif; font-size: 22px; font-weight: 700; }
  .surah-divider-meta { font-size: 12px; opacity: .75; margin-top: 4px; }
  .surah-divider:first-child { margin-top: 0; }

  .ayah-block { padding: 16px 2px; border-bottom: 1px dashed var(--q-muted, var(--line)); }
  .ayah-block:last-child { border-bottom: none; }
  .ayah-block-arabic { font-family: 'Amiri Quran', 'Amiri', serif; font-size: var(--q-font-size, 26px); text-align: right; line-height: 2.4; margin-bottom: 8px; }
  .ayah-block-tafsir { font-size: 14px; line-height: 1.9; color: var(--q-muted, var(--muted)); }
  .ayah-block-actions { margin-top: 8px; display: flex; gap: 6px; justify-content: flex-end; }
  .ayah-mini-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid currentColor; opacity: .55; background: transparent; font-size: 13px; color: inherit; }
  .ayah-block.playing { background: rgba(176,141,62,.12); border-radius: var(--radius-sm); }
  .ayah-block.jump-target { animation: ayahFlash 1.6s ease; border-radius: var(--radius-sm); }

  /* ---------- Page navigation ---------- */
  .page-nav { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .page-nav button { flex: 1; }
  .page-nav .page-indicator-btn { flex: 1.6; font-weight: 700; }
  .page-nav .icon-btn { flex: .7; min-height: 44px; }

  /* ---------- Settings / bookmarks modal bits ---------- */
  .theme-swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0 6px; }
  .theme-swatch { height: 50px; border-radius: 10px; border: 2px solid var(--line); cursor: pointer; }
  .theme-swatch.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(176,141,62,.25); }
  .theme-swatch-label { font-size: 10px; text-align: center; margin-top: 4px; color: var(--muted); }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); gap: 10px; }
  .settings-row:first-of-type { border-top: none; }
  .settings-row.column { flex-direction: column; align-items: stretch; }
  .toggle-switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-switch .track { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s ease; }
  .toggle-switch .thumb { position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s ease; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .toggle-switch input:checked ~ .track { background: var(--teal); }
  .toggle-switch input:checked ~ .thumb { inset-inline-start: 23px; }
  .font-size-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .font-size-row input[type="range"] { flex: 1; }
  .attribution-note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.7; }

  /* ---------- Bookmarks ---------- */
  .bookmark-row-item { display: flex; align-items: center; gap: 8px; padding: 12px 4px; border-top: 1px solid var(--line); }
  .bookmark-row-item:first-child { border-top: none; }
  .bookmark-row-item .info { flex: 1; min-width: 0; cursor: pointer; }
  .bookmark-row-item .name { font-weight: 700; font-size: 14px; overflow-wrap: break-word; }
  .bookmark-row-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---------- Dua Khatm ---------- */
  .dua-khatm-text { text-align: center; font-family: 'Amiri Quran', 'Amiri', serif; font-size: 21px; line-height: 2.4; white-space: pre-line; padding: 6px 4px; }

  /* ---------- Reader page tap zones ---------- */
  .reader-tap-hint { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); opacity: .55; margin-top: 4px; padding: 0 6px; }

  /* ---------- Immersive / fullscreen reading ----------
     Implemented as a plain fixed-position overlay rather than the
     browser's native Fullscreen API — that API behaves inconsistently
     across mobile browsers (partial support on iOS Safari, viewport
     resize glitches on Android Chrome when the address bar hides),
     which was causing the blank/overlapping rendering. A CSS-only
     overlay is fully within our control on every device. */
  body.q-immersive { overflow: hidden; }

  body.q-immersive .topbar,
  body.q-immersive #readerHeader,
  body.q-immersive .reader-audio-bar,
  body.q-immersive .reader-tap-hint,
  body.q-immersive .page-nav,
  body.q-immersive .ayah-block-actions { display: none !important; }

  body.q-immersive .page.wide { padding: 0; margin: 0; max-width: none; width: 100%; }

  body.q-immersive #readerCard {
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: var(--q-bg, var(--card));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 0;
    box-shadow: none;
    margin: 0;
    padding: max(22px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  /* Vertically centers short pages instead of leaving them stranded
     near the top with empty space below. On pages with more text than
     fits, the auto margins collapse to 0 and it behaves like normal
     top-aligned, scrollable content — no clipping either way. */
  body.q-immersive #quranFlow { margin: auto 0; width: 100%; }

  .immersive-page-badge {
    display: none;
    position: fixed;
    bottom: max(14px, env(safe-area-inset-bottom));
    inset-inline: 0;
    margin: 0 auto;
    width: fit-content;
    z-index: 501;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 18px;
    font-size: 12px;
    font-weight: 700;
    box-shadow: var(--shadow);
    opacity: .92;
  }
  body.q-immersive .immersive-page-badge { display: block; }

  .immersive-exit-btn {
    display: none;
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    inset-inline-end: max(14px, env(safe-area-inset-right));
    z-index: 501;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 15px;
    align-items: center; justify-content: center;
    box-shadow: var(--shadow);
    opacity: .85;
  }
  body.q-immersive .immersive-exit-btn { display: flex; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <button class="icon-btn" onclick="handleBack()">←</button>
    <span data-i18n="quran_page_heading">قورئانی پیرۆز</span>
  </div>
  <div class="controls">
    <button class="icon-btn" onclick="openDuaKhatmModal()" title="Dua Khatm">🤲</button>
    <button class="icon-btn" onclick="openBookmarksModal()" title="Bookmarks">🔖</button>
    <button class="icon-btn" onclick="openSettingsModal()" title="Settings">⚙️</button>
    <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    <div class="lang-toggle">
      <button class="lang-pill" data-lang="ckb" onclick="setLang('ckb'); refreshCurrentView();">کوردی</button>
      <button class="lang-pill" data-lang="ar" onclick="setLang('ar'); refreshCurrentView();">العربية</button>
    </div>
    <button class="icon-btn" onclick="setTheme(getTheme()==='dark'?'light':'dark')">
      <span class="theme-toggle-icon">☾</span>
    </button>
  </div>
</div>

<div class="page wide" id="quranPage">
  <!-- Reader — always Mushaf page-by-page (1–604) -->
  <div id="readerView">
    <div class="hero-card" id="readerHeader" style="text-align:center; margin-top:0; padding:18px 20px">
      <h1 id="readerTitle" style="font-size:22px; font-family:'Amiri Quran','Amiri',serif"></h1>
      <p class="sub" id="readerSubtitle" style="margin-top:4px"></p>
    </div>

    <div class="reader-audio-bar">
      <button class="audio-play-btn" id="playBtn" onclick="toggleAudio()">
        <span id="playIcon">▶</span> <span id="playLabel" data-i18n="quran_play_audio">گوێگرتن</span>
      </button>
    </div>

    <div class="hero-card" id="readerCard">
      <div id="quranFlow">
        <p class="sub" data-i18n="prayer_loading">چاوەڕوان بە...</p>
      </div>
    </div>

    <div class="immersive-page-badge" id="immersivePageBadge"></div>
    <button class="immersive-exit-btn" onclick="exitImmersive()" title="Exit fullscreen">✕</button>

    <div class="reader-tap-hint">
      <span data-i18n="quran_tap_hint_next">👈 کرتە/سوایپ بۆ لاپەڕەی داهاتوو</span>
      <span data-i18n="quran_tap_hint_prev">لاپەڕەی پێشوو سوایپ/کرتە 👉</span>
    </div>
    <div class="reader-tap-hint" style="justify-content: center; margin-top: 6px;">
      <span data-i18n="quran_fullscreen_hint">(بۆ خوێندنەوەی پڕشاشە، کرتە لە ناوەڕاستی لاپەڕە بکە)</span>
    </div>

    <div class="page-nav" id="pageNav">
      <button class="btn-outline" onclick="prevPage()" data-i18n="quran_prev_page">پێشوو</button>
      <button class="icon-btn" id="pageNavPlayBtn" onclick="toggleAudio()" title="Play">▶</button>
      <button class="btn-outline page-indicator-btn" id="pageIndicatorBtn" onclick="openGotoPageModal()"></button>
      <button class="btn-outline" onclick="nextPage()" data-i18n="quran_next_page">داهاتوو</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ui-helpers.js"></script>

const SURAH_AYAH_OFFSET = []; 
(function build() {
  let acc = 0;
  for (let i = 0; i < SURAH_META.length; i++) { SURAH_AYAH_OFFSET[i] = acc; acc += SURAH_META[i][3]; }
})();
function surahAyahCount(s) { return SURAH_META[s - 1][3]; }
function globalIndex(surah, ayah) { return SURAH_AYAH_OFFSET[surah - 1] + ayah; }

const PAGE_START_GLOBAL = PAGE_STARTS.map(([s, a]) => globalIndex(s, a));
const JUZ_START_GLOBAL = JUZ_STARTS.map(([s, a]) => globalIndex(s, a));

function lastIndexAtMost(arr, target) {
  let lo = 0, hi = arr.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] <= target) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}
function pageForGlobal(g) { return lastIndexAtMost(PAGE_START_GLOBAL, g) + 1; }
function pageForRef(surah, ayah) { return pageForGlobal(globalIndex(surah, ayah)); }
function pageForSurah(surah) { return pageForRef(surah, 1); }
function juzForGlobal(g) { return lastIndexAtMost(JUZ_START_GLOBAL, g) + 1; }

function walkRefs(startSurah, startAyah, count) {
  const refs = [];
  let s = startSurah, a = startAyah;
  for (let i = 0; i < count; i++) {
    refs.push({ surah: s, ayah: a });
    a++;
    if (a > surahAyahCount(s) && s < SURAH_META.length) { s++; a = 1; }
  }
  return refs;
}

function arabicNumeral(n) {
  const digits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
  return String(n).split('').map((d) => digits[parseInt(d, 10)]).join('');
}

function loadSettings() {
  const defaults = { theme: 'classic', fontSize: 26, showTafsir: false };
  try {
    const saved = JSON.parse(localStorage.getItem('quran_settings') || '{}');
    // Older saved settings may still carry colorMode/showTajweed keys —
    // drop them silently now that Tajweed colouring has been removed.
    delete saved.colorMode;
    delete saved.showTajweed;
    return Object.assign(defaults, saved);
  } catch (e) { return defaults; }
}
function saveSettings() { localStorage.setItem('quran_settings', JSON.stringify(settings)); applyReaderSettings(); }

function loadBookmarks() {
  try {
    const raw = JSON.parse(localStorage.getItem('quran_bookmarks') || '[]');
    return raw.map((b) => ({
      id: b.id || `${b.surah}-${b.ayah}-${b.savedAt || Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      surah: b.surah,
      ayah: b.ayah,
      page: b.page || pageForRef(b.surah, b.ayah),
      name: b.name || null,
      savedAt: b.savedAt || Date.now(),
    }));
  } catch (e) { return []; }
}
function saveBookmarks() { localStorage.setItem('quran_bookmarks', JSON.stringify(bookmarks)); }
function isBookmarked(surah, ayah) { return bookmarks.some((b) => b.surah === surah && b.ayah === ayah); }

function loadLastPosition() {
  try { return JSON.parse(localStorage.getItem('quran_last_position') || 'null'); } catch (e) { return null; }
}
let _posSaveTimer = null;
function saveLastPosition(surah, ayah) {
  clearTimeout(_posSaveTimer);
  _posSaveTimer = setTimeout(() => {
    const m = SURAH_META[surah - 1];
    localStorage.setItem('quran_last_position', JSON.stringify({
      surah, ayah,
      surahName: m ? m[0] : '',
      page: pageForRef(surah, ayah),
      updatedAt: Date.now(),
    }));
  }, 400);
}

function refreshCurrentView() {
  updateReaderHeader();
  renderReader();
}

// ============================================================
// API access
// ============================================================
async function fetchEditionAyahs(kind, ref, edition) {
  const res = await fetch(`${QURAN_API}/${kind}/${ref}/${edition}`);
  const json = await res.json();
  if (json.code !== 200) throw new Error('api-error');
  return json.data.ayahs || [];
}

async function fetchCombined(kind, ref, editions) {
  try {
    const res = await fetch(`${QURAN_API}/${kind}/${ref}/editions/${editions.join(',')}`);
    const json = await res.json();
    if (json.code === 200 && Array.isArray(json.data) && json.data.length === editions.length) {
      return json.data.map((d) => d.ayahs || []);
    }
    throw new Error('unexpected-shape');
  } catch (err) {
    return Promise.all(editions.map((ed) => fetchEditionAyahs(kind, ref, ed)));
  }
}

function showReaderLoading() {
  document.getElementById('quranFlow').innerHTML = `<p class="sub" style="text-align:center">${t('prayer_loading')}</p>`;
}
function showReaderError() {
  document.getElementById('quranFlow').innerHTML = `<div class="empty-state">${t('prayer_error')}</div>`;
}

async function loadAndRenderPage(pageNum, focusRef) {
  showReaderLoading();
  try {
    const [textAyahs, tafsirAyahs] = await fetchCombined('page', pageNum, [TEXT_EDITION, TAFSIR_EDITION]);
    
    const count = textAyahs.length;
    const start = PAGE_STARTS[pageNum - 1];
    const refs = walkRefs(start[0], start[1], count);
    
    currentAyahs = refs.map((r, i) => ({ 
        surah: r.surah, 
        ayah: r.ayah, 
        arabicText: (textAyahs[i] && textAyahs[i].text) || '', 
        tafsir: (tafsirAyahs[i] && tafsirAyahs[i].text) || '' 
    }));
    
    renderReader(focusRef);
  } catch (err) {
    showReaderError();
  }
}

function surahDividerHtml(surahNum) {
  const m = SURAH_META[surahNum - 1];
  return `<div class="surah-divider">
    <div class="surah-divider-name">${m[0]}</div>
    <div class="surah-divider-meta">${escapeHtml(m[2])} · ${m[3]} ${t('quran_ayahs')} · ${m[4] === 'M' ? t('quran_meccan') : t('quran_medinan')}</div>
  </div>`;
}

function renderReader(focusRef) {
  const container = document.getElementById('quranFlow');
  const flowMode = !settings.showTafsir;
  let html = '';
  let lastSurah = null;
  currentAyahs.forEach((a) => {
    if (a.surah !== lastSurah) { html += surahDividerHtml(a.surah); lastSurah = a.surah; }
    if (flowMode) {
      html += `<span class="ayah-unit" data-surah="${a.surah}" data-ayah="${a.ayah}">${a.arabicText}<span class="ayah-num">${arabicNumeral(a.ayah)}</span></span> `;
    } else {
      html += `
        <div class="ayah-unit ayah-block" data-surah="${a.surah}" data-ayah="${a.ayah}">
          <div class="ayah-block-arabic">${a.arabicText}<span class="ayah-num">${arabicNumeral(a.ayah)}</span></div>
          <div class="ayah-block-tafsir">${escapeHtml(a.tafsir)}</div>
          <div class="ayah-block-actions">
            <button class="ayah-mini-btn" onclick="toggleAyahBookmark(${a.surah},${a.ayah})" title="${t('quran_bookmark_add')}">🔖</button>
          </div>
        </div>`;
    }
  });
  
  container.innerHTML = flowMode ? `<p class="quran-flow-text">${html}</p>` : html;
  applyReaderSettings();
  markBookmarksInDom();
  setupPositionObserver();
  setupReaderGestures();
  
  if (focusRef != null && currentAyahs.length) {
    const el = container.querySelector(`.ayah-unit[data-surah="${focusRef.surah}"][data-ayah="${focusRef.ayah}"]`);
    if (el) {
      setTimeout(() => { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('jump-target'); }, 60);
    }
  }
  
  if (pendingAutoPlay) {
    pendingAutoPlay = false;
    startPageAudio();
  } else {
    resetAudioState();
  }
}

function applyReaderSettings() {
  document.body.dataset.qtheme = settings.theme;
  document.getElementById('quranPage').style.setProperty('--q-font-size', settings.fontSize + 'px');
}

function markBookmarksInDom() {
  document.querySelectorAll('.ayah-unit').forEach((el) => {
    const s = parseInt(el.dataset.surah, 10), a = parseInt(el.dataset.ayah, 10);
    el.classList.toggle('bookmarked', isBookmarked(s, a));
  });
}

let posObserver = null;
function setupPositionObserver() {
  if (posObserver) posObserver.disconnect();
  posObserver = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (en.isIntersecting) {
        saveLastPosition(parseInt(en.target.dataset.surah, 10), parseInt(en.target.dataset.ayah, 10));
      }
    });
  }, { root: null, rootMargin: '-15% 0px -75% 0px', threshold: 0 });
  document.querySelectorAll('.ayah-unit').forEach((el) => posObserver.observe(el));
}

// ============================================================
// Navigation — Mushaf page mode only (1..604)
// ============================================================
function updateReaderHeader() {
  const start = PAGE_STARTS[currentPage - 1];
  const m = SURAH_META[start[0] - 1];
  const juz = juzForGlobal(PAGE_START_GLOBAL[currentPage - 1]);
  document.getElementById('readerTitle').textContent = `${t('quran_page_word')} ${arabicNumeral(currentPage)}`;
  document.getElementById('readerSubtitle').textContent = `${m[0]} · ${t('quran_juz_word')} ${arabicNumeral(juz)}`;
  const pageLabel = `${t('quran_page_word')} ${arabicNumeral(currentPage)} / ${arabicNumeral(TOTAL_PAGES)}`;
  document.getElementById('pageIndicatorBtn').textContent = pageLabel;
  const badge = document.getElementById('immersivePageBadge');
  if (badge) badge.textContent = pageLabel;
}

function openPageMode(pageNum, focusRef) {
  currentPage = Math.min(Math.max(pageNum, 1), TOTAL_PAGES);
  window.scrollTo(0, 0);
  updateReaderHeader();
  loadAndRenderPage(currentPage, focusRef);
  const start = PAGE_STARTS[currentPage - 1];
  saveLastPosition(start[0], start[1]);
}

function openReaderAt(surah, ayah) {
  const a = ayah || 1;
  openPageMode(pageForRef(surah, a), { surah, ayah: a });
}

function gotoPage(n) {
  n = Math.min(Math.max(n, 1), TOTAL_PAGES);
  if (n === currentPage) return;
  openPageMode(n);
}
function nextPage() { if (currentPage < TOTAL_PAGES) gotoPage(currentPage + 1); }
function prevPage() { if (currentPage > 1) gotoPage(currentPage - 1); }

function handleBack() {
  history.back();
}

function openGotoPageModal() {
  closeModal();
  openModal(`
    <h3 data-i18n="quran_goto_page">چوون بۆ لاپەڕەیەک</h3>
    <div class="field">
      <input type="number" id="gotoPageInput" min="1" max="${TOTAL_PAGES}" data-i18n-placeholder="quran_goto_page_placeholder" placeholder="ژمارەی لاپەڕە (١ - ٦٠٤)" style="font-size:18px; text-align:center">
    </div>
    <button class="btn-primary" id="gotoPageBtn" data-i18n="quran_go_btn">بچۆ</button>
  `);
  document.getElementById('gotoPageBtn').addEventListener('click', () => {
    const v = parseInt(document.getElementById('gotoPageInput').value, 10);
    if (!v || v < 1 || v > TOTAL_PAGES) { toast(t('required_field'), 'error'); return; }
    closeModal();
    openPageMode(v);
  });
}

// ============================================================
// Reader gestures
// ============================================================
let _lastGestureAt = 0;
function setupReaderGestures() {
  const el = document.getElementById('readerCard');
  if (!el || el.dataset.gesturesBound) return;
  el.dataset.gesturesBound = '1';
  let sx = null, sy = null, st = 0;
  
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, { passive: true });
  
  el.addEventListener('touchend', (e) => {
    if (sx == null) return;
    const tt = e.changedTouches[0];
    const dx = tt.clientX - sx, dy = tt.clientY - sy, dt = Date.now() - st;
    sx = null;
    if (tt.target.closest && tt.target.closest('button, a, input, .ayah-mini-btn')) return;
    _lastGestureAt = Date.now();
    
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 600) {
      if (dx < 0) nextPage(); else prevPage();
      return;
    }
    
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) handleReaderTap(tt.clientX, tt.target);
  }, { passive: true });
  
  el.addEventListener('click', (e) => {
    if (Date.now() - _lastGestureAt < 500) return; 
    if (e.target.closest && e.target.closest('button, a, input, .ayah-mini-btn')) return;
    handleReaderTap(e.clientX, e.target);
  });
}

function handleReaderTap(clientX, targetEl) {
  const rect = document.getElementById('readerCard').getBoundingClientRect();
  const ratio = (clientX - rect.left) / rect.width;
  if (ratio < 0.3) nextPage();
  else if (ratio > 0.7) prevPage();
  else toggleFullscreen();
}

// ============================================================
// Bookmarks 
// ============================================================
function defaultBookmarkName(surah, ayah) {
  const m = SURAH_META[surah - 1];
  return `${m[0]} — ${t('quran_ayahs')} ${arabicNumeral(ayah)}`;
}

function toggleAyahBookmark(surah, ayah) {
  const existing = bookmarks.find((b) => b.surah === surah && b.ayah === ayah);
  if (existing) {
    bookmarks = bookmarks.filter((b) => b.id !== existing.id);
    saveBookmarks();
    markBookmarksInDom();
    toast(t('quran_bookmark_removed_toast'));
    return;
  }
  openAddBookmarkModal(surah, ayah);
}

function openAddBookmarkModal(surah, ayah) {
  const def = defaultBookmarkName(surah, ayah);
  closeModal();
  openModal(`
    <h3 data-i18n="quran_add_bookmark_title">زیادکردنی نیشانە</h3>
    <div class="field">
      <input type="text" id="bookmarkNameInput" value="${escapeHtml(def)}" maxlength="60" style="font-size:15px">
    </div>
    <button class="btn-primary" id="saveBookmarkBtn" data-i18n="quran_bookmark_save">پاشەکەوتکردن</button>
  `);
  const input = document.getElementById('bookmarkNameInput');
  input.focus(); input.select();
  document.getElementById('saveBookmarkBtn').addEventListener('click', () => {
    const name = (input.value || '').trim() || def;
    bookmarks.unshift({ id: `${surah}-${ayah}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, surah, ayah, page: pageForRef(surah, ayah), name, savedAt: Date.now() });
    saveBookmarks();
    markBookmarksInDom();
    closeModal();
    toast(t('quran_bookmark_added_toast'));
  });
}

function openBookmarksModal() {
  const rows = bookmarks.map((b) => `
      <div class="bookmark-row-item">
        <div class="info" onclick="closeModal(); openReaderAt(${b.surah}, ${b.ayah});">
          <div class="name" style="font-family:'Amiri Quran','Amiri',serif">${escapeHtml(b.name || defaultBookmarkName(b.surah, b.ayah))}</div>
          <div class="meta">${t('quran_page_word')} ${arabicNumeral(b.page || pageForRef(b.surah, b.ayah))}</div>
        </div>
        <button class="icon-sm-btn" onclick="renameBookmark('${b.id}')" title="${t('quran_bookmark_rename')}">✎</button>
        <button class="icon-sm-btn" onclick="removeBookmarkById('${b.id}')">✕</button>
      </div>`).join('');
  openModal(`
    <h3 data-i18n="quran_bookmarks_title">نیشانەکان</h3>
    ${bookmarks.length ? rows : `<div class="empty-state" data-i18n="quran_bookmarks_empty">هیچ نیشانەیەکت نییە</div>`}
  `);
}
function removeBookmarkById(id) {
  bookmarks = bookmarks.filter((b) => b.id !== id);
  saveBookmarks();
  markBookmarksInDom();
  openBookmarksModal();
}
function renameBookmark(id) {
  const b = bookmarks.find((x) => x.id === id);
  if (!b) return;
  closeModal();
  openModal(`
    <h3 data-i18n="quran_bookmark_rename">گۆڕینی ناو</h3>
    <div class="field">
      <input type="text" id="renameBookmarkInput" value="${escapeHtml(b.name || defaultBookmarkName(b.surah, b.ayah))}" maxlength="60" style="font-size:15px">
    </div>
    <button class="btn-primary" id="renameBookmarkSaveBtn" data-i18n="quran_bookmark_save">پاشەکەوتکردن</button>
  `);
  const input = document.getElementById('renameBookmarkInput');
  input.focus(); input.select();
  document.getElementById('renameBookmarkSaveBtn').addEventListener('click', () => {
    b.name = (input.value || '').trim() || defaultBookmarkName(b.surah, b.ayah);
    saveBookmarks();
    openBookmarksModal();
  });
}

// ============================================================
// Settings

  ['classic', '#FFFDF7', 'quran_theme_classic'],
  ['night', '#12181A', 'quran_theme_night'],
  ['sepia', '#F1E7D0', 'quran_theme_sepia'],
  ['emerald', '#0F2A22', 'quran_theme_emerald'],
  ['sky', '#EAF3F6', 'quran_theme_sky'],
];

function openSettingsModal() {
  openModal(`
    <h3 data-i18n="quran_settings_title">ڕێکخستنی خوێندنەوە</h3>

    <div class="theme-swatch-grid">
      ${THEME_LIST.map(([key, color]) => `
        <div>
          <div class="theme-swatch ${settings.theme === key ? 'selected' : ''}" style="background:${color}" onclick="setReaderTheme('${key}')"></div>

    <p class="attribution-note">تەفسیر: بورهان محەمەد ئەمین (تەفسیری ئاسان) · دەنگ: مشاری راشد عەفاسی — لە ڕێگەی Al Quran Cloud API</p>
  `);
}
function setReaderTheme(key) { settings.theme = key; saveSettings(); openSettingsModal(); }
function setFontSize(v) { settings.fontSize = parseInt(v, 10); saveSettings(); }
function setTafsir(v) { settings.showTafsir = !!v; saveSettings(); renderReader(); }

// ============================================================
// Audio recitation
// ============================================================
const audioPlayer = new Audio();
let audioPlaylist = [];
let audioIdx = 0;
let audioPlaying = false;

function resetAudioState() {
  stopAudio();
  audioPlaylist = [];
}
function updatePlayIcon() {
  const icon = audioPlaying ? '⏸' : '▶';
  const iconEl = document.getElementById('playIcon');
  if (iconEl) iconEl.textContent = icon;
  const labelEl = document.getElementById('playLabel');
  if (labelEl) labelEl.textContent = audioPlaying ? t('quran_pause_audio') : t('quran_play_audio');
  const navBtn = document.getElementById('pageNavPlayBtn');
  if (navBtn) navBtn.textContent = icon;
}
function stopAudio() {
  audioPlayer.pause();
  audioPlaying = false;
  clearPlayingHighlight();
  updatePlayIcon();
}
function clearPlayingHighlight() {
  document.querySelectorAll('.ayah-unit.playing').forEach((el) => el.classList.remove('playing'));
}
function highlightPlayingAyah(surah, ayah) {
  clearPlayingHighlight();
  const el = document.querySelector(`.ayah-unit[data-surah="${surah}"][data-ayah="${ayah}"]`);
  if (el) { el.classList.add('playing'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}
async function startPageAudio() {
  audioPlaying = true;
  updatePlayIcon();
  try {
    const raw = await fetchEditionAyahs('page', currentPage, AUDIO_EDITION);
    const refs = walkRefs(currentAyahs[0].surah, currentAyahs[0].ayah, raw.length);
    audioPlaylist = raw.map((a, i) => ({ surah: refs[i].surah, ayah: refs[i].ayah, url: a.audio })).filter((x) => x.url);
    if (!audioPlaylist.length) throw new Error('empty');
  } catch (err) {
    audioPlaying = false;
    updatePlayIcon();
    toast(t('quran_audio_error'), 'error');
    return;
  }
  audioIdx = 0;
  playAudioAt(audioIdx);
}
async function toggleAudio() {
  if (audioPlaying) { stopAudio(); return; }
  if (!currentAyahs.length) return;
  audioPlaylist = [];
  await startPageAudio();
}
function playAudioAt(i) {
  if (i >= audioPlaylist.length) return;
  const item = audioPlaylist[i];
  highlightPlayingAyah(item.surah, item.ayah);
  audioPlayer.src = item.url;
  audioPlayer.play().catch(() => { toast(t('quran_audio_error'), 'error'); stopAudio(); });
}
audioPlayer.addEventListener('ended', () => {
  audioIdx++;
  if (audioIdx < audioPlaylist.length) { playAudioAt(audioIdx); return; }
  
  if (audioPlaying && currentPage < TOTAL_PAGES) {
    pendingAutoPlay = true; 
    gotoPage(currentPage + 1);
  } else if (currentPage === TOTAL_PAGES) {
    stopAudio();
    offerDuaKhatm();
  } else {
    stopAudio();
  }
});

// ============================================================
// Fullscreen / immersive reading mode
// A plain CSS overlay (see .q-immersive rules above) rather than the
// native browser Fullscreen API, which rendered inconsistently on
// mobile (blank areas / overlapping text on some devices).
// ============================================================
function enterImmersive() {
  if (document.body.classList.contains('q-immersive')) return;
  document.body.classList.add('q-immersive');
  // Let the phone's hardware/gesture back button close immersive mode
  // instead of leaving the page, by consuming one history entry.
  history.pushState({ qImmersive: true }, '');
}
function exitImmersive() {
  if (!document.body.classList.contains('q-immersive')) return;
  document.body.classList.remove('q-immersive');
  if (history.state && history.state.qImmersive) history.back();
}
function toggleFullscreen() {
  if (document.body.classList.contains('q-immersive')) exitImmersive();
  else enterImmersive();
}
window.addEventListener('popstate', () => {
  if (document.body.classList.contains('q-immersive')) {
    document.body.classList.remove('q-immersive');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') exitImmersive();
});

// ============================================================
// Init
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  const lp = loadLastPosition();
  if (lp && lp.surah && lp.ayah) {
    openPageMode(pageForRef(lp.surah, lp.ayah), lp);
  } else {
    openPageMode(1);
  }
});
